name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: Nix build and flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Build example
        run: nix build --print-build-logs .
      - name: Flake check
        run: nix flake check --print-build-logs
      - name: Upload rendered example and exports
        uses: actions/upload-artifact@v7
        with:
          name: example
          path: result/

  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.4']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install gems
        run: bundle install
      - name: Install Graphviz and Kaitai Struct compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz default-jre-headless
          curl -fsSLO https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler_0.11_all.deb
          sudo apt-get install -y ./kaitai-struct-compiler_0.11_all.deb
          command -v ksc >/dev/null || sudo ln -s "$(command -v kaitai-struct-compiler)" /usr/local/bin/ksc
          ksc --version
          dot -V
      - name: Render example and verify exports
        run: make ASCIIDOCTOR="bundle exec asciidoctor" all test
